<style>
:root {
  color-scheme: light;
  --accent: #1e40af;
  --accent-contrast: #ffffff;
  --bg: #f5f5f4;
  --surface: #ffffff;
  --text: #1c1917;
  --text-muted: #57534e;
  --border: rgba(20, 23, 31, 0.12);
  --radius: 14px;
  --shadow: 0 2px 8px rgba(20, 23, 31, 0.06);
  --space: 16px;
  --success: #0a7a35;
  --danger: #be123c;
  --warning: #8a5300;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

*, *::before, *::after, ::backdrop {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border: 0 solid;
}

[hidden]:where(:not([hidden="until-found"])) { display: none !important; }
.hidden { display: none !important; }
h1, h2, h3, h4, h5, h6 { font-size: inherit; font-weight: inherit; }
a { color: inherit; text-decoration: inherit; }
b, strong { font-weight: 700; }
ol, ul, menu { list-style: none; }
svg, video, canvas, iframe { display: block; vertical-align: middle; }
button, input, select, textarea { font: inherit; color: inherit; background-color: transparent; border-radius: 0; }
button, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
table { border-collapse: collapse; }
img { max-width: 100%; display: block; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 6px; }

@keyframes fadeInScale {
  from { opacity: 0; transform: scale(.97); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(28px); }
  to { opacity: 1; transform: translateY(0); }
}

.animate-modal { animation: fadeInScale .2s ease-out both; }

/* Top build & status banner */
.build-banner {
  background: #f59e0b;
  color: #1c1917;
  font-size: .68rem;
  font-weight: 800;
  text-align: center;
  padding: calc(.28rem + var(--safe-top)) .5rem .28rem;
  letter-spacing: .04em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
}
.offline-chip {
  background: #1c1917;
  color: #fde68a;
  padding: .1rem .45rem;
  border-radius: 999px;
  font-size: .62rem;
}

/* Sticky mobile-first navigation */
nav.top-nav {
  background: #0c0a09;
  position: sticky;
  top: 0;
  z-index: 30;
  box-shadow: 0 2px 10px rgba(0, 0, 0, .22);
}
.nav-inner {
  max-width: 56rem;
  margin: 0 auto;
  padding: .5rem .75rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .45rem;
}
.nav-scroll {
  display: flex;
  align-items: center;
  gap: .35rem;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  flex: 1;
  min-width: 0;
}
.nav-scroll::-webkit-scrollbar { display: none; }

.nav-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .35rem;
  min-height: 38px;
  padding: .42rem .75rem;
  border-radius: 12px;
  font-size: .75rem;
  font-weight: 700;
  color: #e7e5e4;
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform .12s ease, background-color .15s ease;
}
.nav-btn:active { transform: scale(.97); }
.nav-btn.on { background: #fff; color: #0c0a09; }
.nav-btn.gold { background: #f59e0b; color: #0c0a09; }
.nav-btn.install { background: #16a34a; color: #fff; }

.profile-btn {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  min-height: 38px;
  background: #1c1917;
  border: 1px solid #44403c;
  border-radius: 12px;
  padding: .35rem .6rem;
  color: #fff;
  font-weight: 700;
  font-size: .75rem;
  cursor: pointer;
  flex-shrink: 0;
}
.profile-btn:active { transform: scale(.97); }

/* Simulator bar */
.sim-bar {
  background: #451a03;
  color: #fef3c7;
  font-size: .7rem;
  padding: .4rem .75rem;
  display: flex;
  align-items: center;
  gap: .35rem;
  overflow-x: auto;
  scrollbar-width: none;
  white-space: nowrap;
}
.sim-bar::-webkit-scrollbar { display: none; }

/* Dialog / Bottom sheet */
dialog.adalex {
  position: fixed;
  inset: 0;
  width: 100%;
  max-width: 100%;
  height: 100%;
  max-height: 100%;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 40;
}
dialog.adalex::backdrop {
  background: rgba(12, 10, 9, .75);
  backdrop-filter: blur(5px);
}
@media (min-width: 640px) {
  dialog.adalex { align-items: center; padding: 1rem; }
}
.adalex-panel {
  background: #fff;
  width: 100%;
  max-width: 34rem;
  max-height: 90dvh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  border-radius: 24px 24px 0 0;
  padding-bottom: calc(.5rem + var(--safe-bottom));
  animation: slideUp .25s ease-out both;
  position: relative;
  box-shadow: 0 -8px 30px rgba(0, 0, 0, .22);
}
.sheet-handle {
  width: 38px;
  height: 4px;
  background: #d6d3d1;
  border-radius: 999px;
  margin: .55rem auto .15rem;
}
@media (min-width: 640px) {
  .adalex-panel { border-radius: 24px; padding-bottom: 0; }
  .sheet-handle { display: none; }
}
.dialog-close-btn {
  position: absolute;
  top: .65rem;
  right: .65rem;
  z-index: 3;
  background: rgba(245, 245, 244, .95);
  color: #1c1917;
  border: 1px solid #e7e5e4;
  border-radius: 999px;
  width: 38px;
  height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
}
.dialog-close-btn:active { transform: scale(.94); }

/* Toast */
.toast-container {
  position: fixed;
  top: calc(.75rem + var(--safe-top));
  left: 50%;
  transform: translateX(-50%);
  z-index: 60;
  width: 92%;
  max-width: 28rem;
  pointer-events: none;
  display: none;
}
.toast-container.show { display: block; }
.toast-item {
  background: #1c1917;
  color: #fff;
  padding: .75rem 1rem;
  border-radius: 14px;
  font-size: .82rem;
  font-weight: 600;
  margin-bottom: .5rem;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .24);
  text-align: center;
  animation: slideUp .18s ease-out both;
}

/* Cards & Buttons */
.card {
  background: #fff;
  border-radius: 20px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(231, 229, 228, .75);
  padding: 1rem;
}
@media (min-width: 640px) {

.btn-main, .btn-soft, .btn-danger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .4rem;
  min-height: 42px;
  border-radius: 12px;
  cursor: pointer;
  text-align: center;
  line-height: 1.2;
  transition: transform .12s ease, opacity .15s ease;
}
.btn-main:active, .btn-soft:active, .btn-danger:active { transform: scale(.98); }

.btn-main {
  background: linear-gradient(90deg, #1e40af, #3730a3);
  color: #fff;
  font-weight: 800;
  padding: .65rem 1rem;
  font-size: .84rem;

.btn-soft {
  background: #f5f5f4;
  color: #1c1917;
  border: 1px solid #e7e5e4;
  font-weight: 700;
  padding: .55rem .85rem;
  font-size: .78rem;
}
.btn-danger {
  background: #fff1f2;
  color: #9f1239;
  border: 1px solid #fecdd3;
  font-weight: 700;
  padding: .55rem .85rem;
  font-size: .78rem;
}
.btn-sm {
  min-height: 36px;
  padding: .4rem .65rem;
  font-size: .74rem;
}

.fld {
  width: 100%;

input[type="color"].fld {

.lbl {

.help {

  margin-top: .25rem;
  line-height: 1.4;

.pill {
  display: inline-flex;
  align-items: center;
  gap: .25rem;
  font-size: .66rem;
  font-weight: 700;
  padding: .18rem .55rem;

  border: 1px solid;
  white-space: nowrap;

/* Role & Status badge colors */
.b-sky { background: #e0f2fe; color: #0c4a6e; border-color: #7dd3fc; }
.b-emerald { background: #d1fae5; color: #064e3b; border-color: #6ee7b7; }
.b-purple { background: #f3e8ff; color: #581c87; border-color: #d8b4fe; }
.b-amber { background: #fef3c7; color: #78350f; border-color: #fcd34d; }
.b-rose { background: #ffe4e6; color: #881337; border-color: #fda4af; }

.dept-card {

.dept-title {

.safe-grid-2 {

.safe-grid-sm {

/* Tables with sticky first column on mobile */
.table-wrap {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;

table.adx {

  border-collapse: collapse;

}

/* Footer */
footer.adx-foot {

/* Header hero */
.hero-header {
  max-width: 56rem;
  margin: 0 auto;
  padding: 1.4rem 1rem 2.2rem;
  text-align: center;
  color: #fff;
}
.hero-title {
  font-size: clamp(1.25rem, 4.5vw, 1.65rem);

  line-height: 1.2;
  margin: .65rem 0 .25rem;
}
@media (min-width: 640px) {
  .hero-header { padding: 2rem 1rem 2.6rem; }
}
</style>

<!-- Service Worker source para hospedagem offline -->
<script type="text/plain" id="adalex-sw-code">
const CACHE_NAME = "adalex-digital-v2.0";
const ASSETS = ["./", "./index.html"];

self.addEventListener("install", (event) => {
  event.waitUntil(
    caches.open(CACHE_NAME).then((cache) => cache.addAll(ASSETS)).catch(() => {})
  );
  self.skipWaiting();
});

self.addEventListener("activate", (event) => {
  event.waitUntil(
    caches.keys().then((keys) =>
      Promise.all(keys.filter((k) => k !== CACHE_NAME).map((k) => caches.delete(k)))
    )
  );
  self.clients.claim();
});

self.addEventListener("fetch", (event) => {
  if (event.request.method !== "GET") return;
  event.respondWith(
    caches.match(event.request).then((cached) => {
      const networkFetch = fetch(event.request)
        .then((response) => {
          if (response && response.status === 200) {
            const copy = response.clone();
            caches.open(CACHE_NAME).then((cache) => cache.put(event.request, copy));
          }
          return response;
        })
        .catch(() => cached);
      return cached || networkFetch;
    })
  );
});
</script>

function merge(a,b){
  if(b===null||typeof b!=="object"||Array.isArray(b)) return b===undefined?a:b;
  var out=Array.isArray(a)?a.slice():Object.assign({},a);
  Object.keys(b).forEach(function(k){
    if(Array.isArray(b[k])) out[k]=b[k];
    else if(b[k]&&typeof b[k]==="object"&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k])) out[k]=merge(a[k],b[k]);
    else out[k]=b[k];
  });
  return out;
}
function migrate(s){
  if(!Array.isArray(s.roles)||!s.roles.length) s.roles=JSON.parse(JSON.stringify(DEFAULT_ROLES));
  DEFAULT_ROLES.forEach(function(dr){
    if(!s.roles.find(function(r){return r.id===dr.id;})) s.roles.push(Object.assign({},dr));
  });
  if(!Array.isArray(s.functions)) s.functions=DEFAULT_FUNCTIONS.slice();

  var d=defaultPerms();
  s.permissions=s.permissions||{};
  Object.keys(d).forEach(function(k){
    s.permissions[k]=s.permissions[k]||{};
    s.roles.forEach(function(r,idx){
      if(typeof s.permissions[k][r.id]!=="boolean"){
        var baseIdx=Math.min(Math.max(r.level||0,0),4);
        s.permissions[k][r.id]=!!(d[k][DEFAULT_ROLES[baseIdx].id]);
      }
    });
  });

  ["departments","directorate","services","notices","quickLinks","adminButtons","users","submissions"].forEach(function(k){if(!Array.isArray(s[k])) s[k]=[];});
  s.users.forEach(function(u){
    if(!Array.isArray(u.functions)) u.functions=[];
    if(!roleObj(u.role,s)) u.role="membro";
  });
  s.departments.forEach(function(dp){if(!Array.isArray(dp.team)) dp.team=[]; if(!dp.visibility) dp.visibility="todos";});
  if(!THEMES[s.church.theme]) s.church.theme="navy";
  return s;
}

/* ---------- Role & Theme helpers ---------- */
function roleObj(id,st){
  st=st||state;
  return (st.roles||DEFAULT_ROLES).find(function(r){return r.id===id;})||DEFAULT_ROLES[0];
}
function allRoles(){return state.roles||DEFAULT_ROLES;}
function roleLevel(id){return roleObj(id).level||0;}
function theme(){
  var c=state.church;
  if(c.theme==="custom"){
    var hex=c.customPrimaryHex||"#1e40af";
    var hex2=c.customSecondaryHex||"#312e81";
    return {label:"Cor Personalizada",hex:hex,hex2:hex2,hexLight:hex+"18"};
  }
  return THEMES[c.theme]||THEMES.navy;
}

/* ---------- PWA: Inline Manifest + PNG Icons + Service Worker ---------- */
function buildAppIconPng(size,bgHex){
  var c=document.createElement("canvas");
  c.width=size;c.height=size;
  var ctx=c.getContext("2d");
  var r=Math.round(size*0.22);

  ctx.beginPath();
  ctx.moveTo(r,0);
  ctx.arcTo(size,0,size,size,r);
  ctx.arcTo(size,size,0,size,r);
  ctx.arcTo(0,size,0,0,r);
  ctx.arcTo(0,0,size,0,r);
  ctx.closePath();
  var grad=ctx.createLinearGradient(0,0,size,size);
  grad.addColorStop(0,"#0f172a");
  grad.addColorStop(1,bgHex||"#1e40af");
  ctx.fillStyle=grad;
  ctx.fill();

  ctx.fillStyle="#ffffff";
  var cw=Math.round(size*0.1);
  var ch=Math.round(size*0.44);
  var cx=Math.round((size-cw)/2);
  var cy=Math.round(size*0.18);
  ctx.fillRect(cx,cy,cw,ch);
  ctx.fillRect(Math.round(size*0.33),Math.round(size*0.3),Math.round(size*0.34),cw);

  ctx.fillStyle="#fcd34d";
  ctx.font="900 "+Math.round(size*0.145)+"px Inter, system-ui, sans-serif";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText("ADALEX",size/2,size*0.76);

  return c.toDataURL("image/png");
}

function setupPwa(){
  var t=theme();
  var meta=document.getElementById("metaThemeColor");
  if(meta) meta.setAttribute("content",t.hex);

  var icon192=buildAppIconPng(192,t.hex);
  var icon512=buildAppIconPng(512,t.hex);
  var appleIcon=document.getElementById("appleTouchIcon");
  if(appleIcon) appleIcon.href=icon192;

  var startUrl="./";
  try{
    if(location.protocol==="http:"||location.protocol==="https:"){
      startUrl=location.pathname||"./";
    }
  }catch(e){}

  var manifest={
    name:state.church.name||"ADALEX Digital",
    short_name:"ADALEX",
    description:state.church.subtitle||"Aplicativo oficial da igreja",
    start_url:startUrl,
    scope:"./",
    display:"standalone",
    orientation:"portrait",
    background_color:"#0c0a09",
    theme_color:t.hex,
    icons:[
      {src:icon192,sizes:"192x192",type:"image/png",purpose:"any maskable"},
      {src:icon512,sizes:"512x512",type:"image/png",purpose:"any maskable"}
    ]
  };
  var link=document.getElementById("pwaManifest");
  if(link){
    link.href="data:application/manifest+json;charset=utf-8,"+encodeURIComponent(JSON.stringify(manifest));
  }
}

function registerInlineServiceWorker(){
  if(!("serviceWorker" in navigator)){
    pwa.swStatus="Navegador sem suporte a Service Worker";
    return;
  }
  if(location.protocol!=="https:"&&location.hostname!=="localhost"&&location.hostname!=="127.0.0.1"){
    pwa.swStatus="Requer HTTPS ou localhost (baixe o sw.js na aba Backup)";
    return;
  }
  navigator.serviceWorker.register("./sw.js").then(function(){
    pwa.swStatus="Ativo (./sw.js registrado)";
    if(ui.page==="admin-panel"&&ui.adminTab==="backup") render();
  }).catch(function(){
    pwa.swStatus="Aguardando ./sw.js na raiz do site (baixe na aba Backup)";
  });
}

/* ---------- utils ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function plain(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();}
function normalizePass(s){return String(s==null?"":s).replace(/[\u200B\u200D\uFEFF\u00A0]/g,"").trim();}
function initials(n){var p=String(n||"?").trim().split(/\s+/);return ((p[0]||"?")[0]+((p[1]||"")[0]||"")).toUpperCase();}
function avatar(photo,name,size,bg){
  size=size||56;
  var st="width:"+size+"px;height:"+size+"px;border-radius:16px;object-fit:cover;flex-shrink:0";
  if(photo) return '<img src="'+esc(photo)+'" alt="Foto de '+esc(name)+'" style="'+st+'">';
  return '<div style="'+st+';display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:'+Math.round(size*.32)+'px;background:'+(bg||theme().hex)+'">'+esc(initials(name))+'</div>';
}
function toast(msg,type){
  var c=document.getElementById("toastContainer");
  var t=document.createElement("div");
  t.className="toast-item";
  if(type==="error") t.style.background="#9f1239";
  else if(type==="success") t.style.background="#065f46";
  t.textContent=msg;
  c.appendChild(t);c.classList.add("show");
  setTimeout(function(){t.remove();if(!c.children.length)c.classList.remove("show");},2600);
}
function copyText(txt,cb){
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(txt).then(function(){cb&&cb(true);},function(){fallbackCopy(txt,cb);});
    return;
  }
  fallbackCopy(txt,cb);
}
function fallbackCopy(txt,cb){
  var ta=document.createElement("textarea");
  ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.focus();ta.select();
  var ok=false;
  try{ok=document.execCommand("copy");}catch(e){}
  ta.remove();
  cb&&cb(ok);
}
function driveLink(url){
  var m=String(url||"").match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)?([\w-]{20,})/);
  if(m) return "https://drive.google.com/thumbnail?id="+m[1]+"&sz=w800";
  return url;
}
function resizePhoto(file,cb){
  var r=new FileReader();
  r.onload=function(){
    var img=new Image();
    img.onload=function(){
      var side=Math.min(img.width,img.height);
      var sx=(img.width-side)/2,sy=(img.height-side)/2;
      var c=document.createElement("canvas");c.width=320;c.height=320;
      c.getContext("2d").drawImage(img,sx,sy,side,side,0,0,320,320);
      cb(c.toDataURL("image/jpeg",0.72));
    };
    img.src=r.result;
  };
  r.readAsDataURL(file);
}
function pickFile(cb){
  var inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  inp.onchange=function(){if(inp.files[0]) resizePhoto(inp.files[0],cb);};
  inp.click();
}

/* ---------- permissions ---------- */
function can(key,roleId){
  roleId=roleId||session.role;
  var ro=roleObj(roleId);
  if(roleId==="admin_geral"||ro.level>=4) return true;
  var v=state.permissions[key]&&state.permissions[key][roleId];
  if(typeof v==="boolean") return v;
  var all=PERM_VIEW.concat(PERM_MANAGE).filter(function(x){return x.k===key;})[0];
  var baseIdx=Math.min(Math.max(ro.level||0,0),4);
  return all?!!all.def[baseIdx]:false;
}
function visible(vis,roleId,dep){
  roleId=roleId||session.role;
  var ro=roleObj(roleId);
  if(roleId==="admin_geral"||ro.level>=4) return true;
  if(vis==="personalizado") return !!(dep&&dep.visibleTo&&dep.visibleTo.indexOf(roleId)>=0);
  if(vis==="visitantes") return roleId==="visitante";
  var min=VIS_MIN[vis];
  if(min===undefined) return true;
  return (ro.level||0)>=min;
}
function canAdmin(){
  return session.role==="admin_geral"||roleLevel(session.role)>=4||can("verDiretoriaAdmin")||can("gerenciarPix")||can("gerenciarIdentidade")||can("gerenciarUsuarios")||can("gerenciarCultos")||can("gerenciarAvisosLinks");
}
function canAccessAdminPanel(){return canAdmin();}
function isManager(){return canAccessAdminPanel();}

/* ---------- dialog helper ---------- */
function openDialog(innerHtml,onOpen){
  var d=document.createElement("dialog");
  d.className="adalex";
  d.innerHTML='<div class="adalex-panel animate-modal" role="document">'+
    '<div class="sheet-handle" aria-hidden="true"></div>'+
    '<button type="button" class="dialog-close-btn" data-close aria-label="Fechar">✕</button>'+
    innerHtml+"</div>";
  document.body.appendChild(d);
  d.addEventListener("close",function(){d.remove();});
  d.addEventListener("click",function(e){
    if(e.target===d){d.close();return;}
    if(e.target.closest("[data-close]")){d.close();return;}
  });
  d.showModal();
  if(onOpen) onOpen(d);
  return d;
}
function closeAllDialogs(){document.querySelectorAll("dialog.adalex").forEach(function(d){d.close();});}

/* tab 4: dynamic permissions for all roles including custom ones */
function permTable(list,title,sub){
  var roles=allRoles();
  var head='<tr><th class="nm">Permissão</th>'+roles.map(function(r){return "<th>"+esc(r.label)+"</th>";}).join("")+"</tr>";
  var rows=list.map(function(p){
    return '<tr><td class="nm"><div style="font-weight:700">'+esc(p.n)+'</div><div class="help">'+esc(p.d)+"</div></td>"+
      roles.map(function(r){
        var locked=r.id==="admin_geral"?" disabled":"";
        return '<td><input type="checkbox" data-perm="'+p.k+'" data-role="'+esc(r.id)+'"'+(can(p.k,r.id)?" checked":"")+locked+"></td>";
      }).join("")+"</tr>";
  }).join("");
  return '<div class="card" style="padding:0;overflow:hidden;margin-bottom:1rem"><div style="padding:.85rem 1rem"><div style="font-weight:800">'+esc(title)+'</div><div class="help">'+esc(sub)+'</div></div><div class="table-wrap"><table class="adx"><thead>'+head+"</thead><tbody>"+rows+"</tbody></table></div></div>";
}

/* ---------- import of members ---------- */
function parseLine(line){
  var t=line.trim();if(!t) return null;
  if(/^(nome|membro|c[oó]digo|matr[ií]cula)\b/i.test(t)&&/(c[oó]digo|matr[ií]cula)/i.test(t)&&!/\d/.test(t)) return {skip:true};
  var parts=t.split(/\s*[|;:\t,]\s*|\s+-\s+/).map(function(x){return x.trim();}).filter(Boolean);
  var name="",code="";
  if(parts.length===1){
    if(/^\d+$/.test(parts[0])) code=parts[0]; else name=parts[0];
  } else {
    var numIdx=-1;parts.forEach(function(p,i){if(numIdx<0&&/^\d{2,}$/.test(p)) numIdx=i;});
    if(numIdx>=0){code=parts[numIdx];name=parts.filter(function(_,i){return i!==numIdx;}).join(" ");}
    else name=parts.join(" ");
  }
  return {name:name.trim(),code:code.trim()};
}
function classifyImport(text){
  var lines=String(text||"").split(/\r?\n/);
  var out=[],seenCodes={},seenNames={};
  lines.forEach(function(l){
    var p=parseLine(l);if(!p||p.skip) return;
    var item={name:p.name,code:p.code,status:""};
    if(!item.name){item.status="Sem nome";}
    else if(item.code){
      var byCode=state.users.find(function(u){return u.memberCode&&u.memberCode===item.code;});
      if(seenCodes[item.code]) item.status="Duplicado na lista";
      else if(byCode) item.status="Já cadastrado com este código";
      else item.status="Novo";
      seenCodes[item.code]=true;
    } else {
      var byName=state.users.find(function(u){return plain(u.name)===plain(item.name);});
      if(seenNames[plain(item.name)]) item.status="Duplicado na lista";
      else if(byName) item.status="Nome já existe sem código";
      else item.status="Sem código";
      seenNames[plain(item.name)]=true;
    }
    out.push(item);
  });
  return out;
}

    d.querySelector('[data-act="ipBack"]').addEventListener("click",function(){d.close();});
    d.querySelector('[data-act="ipAdd"]').addEventListener("click",function(){

      var dept=v("imp_dept").trim(),role=v("imp_role")||"membro";
      var added=0,updated=0,skipped=0;
      items.forEach(function(i){
        if(i.status==="Novo"){state.users.push({id:"u"+Date.now()+Math.random().toString(36).slice(2,6),name:i.name,role:role,functions:[],email:"",whatsapp:"",memberCode:i.code,accessPassword:"",department:dept});added++;}

        else if(i.status==="Já cadastrado com este código"&&upd){var u=state.users.find(function(x){return x.memberCode===i.code;});if(u){u.name=i.name;updated++;}}

/* ---------- render & action dispatcher ---------- */
function render(){
  var app=document.getElementById("appRoot");
  try{

    renderNav();
    var html="";
    if(ui.page==="admin-panel") html=adminHtml();
    else if(ui.page==="prayer") html=headerHtml()+prayerHtml();
    else html=headerHtml()+homeHtml();
    app.innerHTML=html;
    document.getElementById("footName").textContent=state.church.name;
    document.getElementById("footInfo").textContent=state.church.address+(can("verCnpj")&&state.church.cnpj?" • CNPJ "+state.church.cnpj:"");

  var u=findUser(el.getAttribute("data-id"));
  ui.userEditId=el.getAttribute("data-id");
  ui.userForm={functions:u&&Array.isArray(u.functions)?u.functions.slice():[]};

  render();window.scrollTo(0,0);

A.saveUser=function(){
  var name=v("us_name").trim();
  if(!name){toast("Informe o nome completo.","error");return;}
  var code=v("us_code").trim();
  if(code){var clash=state.users.find(function(u){return u.memberCode===code&&u.id!==ui.userEditId;});if(clash){toast("Este código já pertence a outra pessoa.","error");return;}}
  var editing=ui.userEditId?findUser(ui.userEditId):null;
  var funcs=Array.isArray(ui.userForm.functions)?ui.userForm.functions:(editing&&Array.isArray(editing.functions)?editing.functions:[]);
  var photoVal=ui.userForm.photo!==undefined?ui.userForm.photo:(editing?editing.photo:"");
  var data={
    name:name,role:v("us_role"),functions:funcs,memberCode:code,accessPassword:v("us_pass"),
    whatsapp:v("us_wa"),email:v("us_email"),department:v("us_dept"),photo:photoVal
  };
  if(editing){Object.assign(editing,data);}
  else state.users.push(Object.assign({id:"u"+Date.now()},data));
  ui.userEditId=null;ui.userForm={functions:[]};ui.showNewRoleBox=false;
  save();render();toast("Pessoa salva com sucesso!","success");
};

A.savePerms=function(){
  document.querySelectorAll("input[data-perm]").forEach(function(inp){
    var k=inp.getAttribute("data-perm"),r=inp.getAttribute("data-role");
    state.permissions[k]=state.permissions[k]||{};
    state.permissions[k][r]=inp.checked;
  });
  var cur=v("pw_cur"),nw=v("pw_new"),cf=v("pw_conf");
  if(nw||cf||cur){
    if(normalizePass(cur)!==normalizePass(state.church.masterAdminPin)){toast("Senha atual incorreta.","error");return;}
    if(!nw){toast("Digite a nova senha.","error");return;}
    if(nw!==cf){toast("A confirmação não confere.","error");return;}
    state.church.masterAdminPin=normalizePass(nw);
  }
  save();render();toast("Permissões salvas","success");
};

function teamForm(dep,idx){
  var m=idx==null?{name:"",role:"",photo:"",phone:""}:dep.team[idx];
  openDialog('<div style="padding:1.25rem;display:grid;gap:.65rem"><div style="font-weight:900;font-size:1.05rem">'+(idx==null?"Adicionar integrante":"Editar integrante")+'</div>'+
    '<div><label class="lbl" for="tm_n">Nome</label><input class="fld" id="tm_n" value="'+esc(m.name)+'"><button class="btn-soft btn-sm" id="tm_pick" style="width:100%;margin-top:.4rem">Escolher da lista de pessoas</button></div>'+
    '<div><label class="lbl" for="tm_r">Função / Cargo na equipe</label><input class="fld" id="tm_r" value="'+esc(m.role||"")+'"></div>'+
    '<div><label class="lbl" for="tm_p">Telefone</label><input class="fld" id="tm_p" type="tel" inputmode="tel" value="'+esc(m.phone||"")+'"></div>'+
    '<div style="display:flex;gap:.45rem;flex-wrap:wrap"><button class="btn-soft btn-sm" id="tm_file">Enviar foto</button><button class="btn-soft btn-sm" id="tm_link">Usar link</button></div>'+
    '<div style="display:flex;justify-content:flex-end;gap:.5rem"><button class="btn-soft" data-close>Cancelar</button><button class="btn-main" id="tm_save">Salvar integrante</button></div></div>',function(d){
    var photo=m.photo||"";
    function setName(n,ph,phone,fn){d.querySelector("#tm_n").value=n;if(phone) d.querySelector("#tm_p").value=phone;if(ph) photo=ph;if(fn&&!d.querySelector("#tm_r").value) d.querySelector("#tm_r").value=fn;}
    d.querySelector("#tm_pick").addEventListener("click",function(){openPicker(function(p){setName(p.name,p.photo,p.phone,(p.functions||[])[0]||"");});});
    d.querySelector("#tm_file").addEventListener("click",function(){pickFile(function(x){photo=x;toast("Foto carregada","success");});});
    d.querySelector("#tm_link").addEventListener("click",function(){var u=window.prompt("Link da foto:","");if(u) photo=driveLink(u.trim());});
    d.querySelector("#tm_save").addEventListener("click",function(){
      var n=d.querySelector("#tm_n").value.trim();if(!n){toast("Informe o nome.","error");return;}
      var entry={name:n,role:d.querySelector("#tm_r").value.trim(),phone:d.querySelector("#tm_p").value.trim(),photo:photo,memberCodeRef:""};
      if(idx==null) dep.team.push(entry); else dep.team[idx]=entry;
      save();d.close();render();toast("Integrante salvo","success");
    });
  });
}

A.backupDown=function(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="adalex_backup_v2.json";
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
  toast("Backup baixado","success");
};
A.backupImport=function(){
  var inp=document.createElement("input");inp.type="file";inp.accept="application/json,.json";
  inp.onchange=function(){
    var f=inp.files[0];if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var data=JSON.parse(r.result);
        state=migrate(merge(baseDefaultState(),data));
        save();setupPwa();render();toast("Backup importado","success");
      }catch(e){toast("Arquivo inválido.","error");}
    };
    r.readAsText(f);
  };
  inp.click();
};

  });
};

/* generic click & input listeners */
document.addEventListener("click",function(e){
  var nav=e.target.closest("[data-nav]");
  if(nav){e.preventDefault();ui.page=nav.getAttribute("data-nav");render();window.scrollTo(0,0);return;}
  var el=e.target.closest("[data-act]");
  if(!el) return;
  var act=el.getAttribute("data-act");
  if(typeof A[act]!=="function") return;
  if(el.tagName==="A") e.preventDefault();
  try{A[act](el,e);}catch(err){toast("Ação indisponível: "+err.message,"error");}
});

document.addEventListener("input",function(e){
  if(e.target&&e.target.id==="us_search"){
    ui.userSearch=e.target.value;
    var pos=e.target.selectionStart;
    render();
    var box=document.getElementById("us_search");
    if(box){box.focus();try{box.setSelectionRange(pos,pos);}catch(err){}}
  }
});

document.addEventListener("change",function(e){
  if(e.target&&e.target.id==="us_func_filter"){
    ui.funcFilter=e.target.value;
    render();
  }
});

window.addEventListener("keydown",function(e){
  if(e.key==="Escape") closeAllDialogs();
  if(e.key==="Enter"&&e.target&&e.target.id==="nf_name"){
    e.preventDefault();
    A.createInlineFunc();
  }
});

/* ---------- PWA event listeners ---------- */
window.addEventListener("beforeinstallprompt",function(e){
  e.preventDefault();
  pwa.deferredPrompt=e;
  renderNav();
});
window.addEventListener("appinstalled",function(){
  pwa.deferredPrompt=null;
  renderNav();
  toast("Aplicativo instalado na tela inicial!","success");
});
function updateOnlineStatus(){
  var chip=document.getElementById("offlineChip");
  if(chip) chip.hidden=navigator.onLine;
}
window.addEventListener("online",updateOnlineStatus);
window.addEventListener("offline",updateOnlineStatus);

/* ---------- initial render ---------- */
setupPwa();
registerInlineServiceWorker();
updateOnlineStatus();
render();
})();
</script>
