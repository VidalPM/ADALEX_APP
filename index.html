<style>
:root {
  color-scheme: light;
  --accent: #1e40af;
  --accent-contrast: #ffffff;
  --bg: #f5f5f4;
  --surface: #ffffff;
  --text: #1c1917;
  --text-muted: #57534e;
  --border: rgba(20, 23, 31, 0.12);
  --radius: 14px;
  --shadow: 0 2px 8px rgba(20, 23, 31, 0.06);
  --space: 16px;
  --success: #0a7a35;
  --danger: #be123c;
  --warning: #8a5300;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

*, *::before, *::after, ::backdrop {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border: 0 solid;
}

[hidden]:where(:not([hidden="until-found"])) { display: none !important; }
.hidden { display: none !important; }
h1, h2, h3, h4, h5, h6 { font-size: inherit; font-weight: inherit; }
a { color: inherit; text-decoration: inherit; }
b, strong { font-weight: 700; }
ol, ul, menu { list-style: none; }
svg, video, canvas, iframe { display: block; vertical-align: middle; }
button, input, select, textarea { font: inherit; color: inherit; background-color: transparent; border-radius: 0; }
button, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
table { border-collapse: collapse; }
img { max-width: 100%; display: block; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 6px; }

@keyframes fadeInScale {
  from { opacity: 0; transform: scale(.97); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(28px); }
  to { opacity: 1; transform: translateY(0); }
}

.animate-modal { animation: fadeInScale .2s ease-out both; }

/* Top build & status banner */
.build-banner {
  background: #f59e0b;
  color: #1c1917;
  font-size: .68rem;
  font-weight: 800;
  text-align: center;
  padding: calc(.28rem + var(--safe-top)) .5rem .28rem;
  letter-spacing: .04em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
}
.offline-chip {
  background: #1c1917;
  color: #fde68a;
  padding: .1rem .45rem;
  border-radius: 999px;
  font-size: .62rem;
}

/* Sticky mobile-first navigation */
nav.top-nav {
  background: #0c0a09;
  position: sticky;
  top: 0;
  z-index: 30;
  box-shadow: 0 2px 10px rgba(0, 0, 0, .22);
}
.nav-inner {
  max-width: 56rem;
  margin: 0 auto;
  padding: .5rem .75rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .45rem;
}
.nav-scroll {
  display: flex;
  align-items: center;
  gap: .35rem;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  flex: 1;
  min-width: 0;
}
.nav-scroll::-webkit-scrollbar { display: none; }

.nav-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .35rem;
  min-height: 38px;
  padding: .42rem .75rem;
  border-radius: 12px;
  font-size: .75rem;
  font-weight: 700;
  color: #e7e5e4;
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform .12s ease, background-color .15s ease;
}
.nav-btn:active { transform: scale(.97); }
.nav-btn.on { background: #fff; color: #0c0a09; }
.nav-btn.gold { background: #f59e0b; color: #0c0a09; }
.nav-btn.install { background: #16a34a; color: #fff; }

.profile-btn {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  min-height: 38px;
  background: #1c1917;
  border: 1px solid #44403c;
  border-radius: 12px;
  padding: .35rem .6rem;
  color: #fff;
  font-weight: 700;
  font-size: .75rem;
  cursor: pointer;
  flex-shrink: 0;
}
.profile-btn:active { transform: scale(.97); }

/* Simulator bar */
.sim-bar {
  background: #451a03;
  color: #fef3c7;
  font-size: .7rem;
  padding: .4rem .75rem;

  align-items: center;
  gap: .35rem;
  overflow-x: auto;

  white-space: nowrap;
}
.sim-bar::-webkit-scrollbar { display: none; }

/* Dialog / Bottom sheet */
dialog.adalex {
  position: fixed;
  inset: 0;
  width: 100%;
  max-width: 100%;
  height: 100%;
  max-height: 100%;
  margin: 0;

  border: 0;
  background: transparent;
  overflow: hidden;

  align-items: flex-end;
  justify-content: center;

}
dialog.adalex::backdrop {
  background: rgba(12, 10, 9, .75);
  backdrop-filter: blur(5px);
}
@media (min-width: 640px) {
  dialog.adalex { align-items: center; padding: 1rem; }
}
.adalex-panel {
  background: #fff;
  width: 100%;
  max-width: 34rem;
  max-height: 90dvh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  border-radius: 24px 24px 0 0;
  padding-bottom: calc(.5rem + var(--safe-bottom));
  animation: slideUp .25s ease-out both;
  position: relative;
  box-shadow: 0 -8px 30px rgba(0, 0, 0, .22);
}
.sheet-handle {
  width: 38px;
  height: 4px;
  background: #d6d3d1;
  border-radius: 999px;
  margin: .55rem auto .15rem;
}
@media (min-width: 640px) {
  .adalex-panel { border-radius: 24px; padding-bottom: 0; }

}
.dialog-close-btn {
  position: absolute;
  top: .65rem;
  right: .65rem;
  z-index: 3;
  background: rgba(245, 245, 244, .95);
  color: #1c1917;
  border: 1px solid #e7e5e4;
  border-radius: 999px;

  height: 38px;

  justify-content: center;

  font-weight: 700;

}
.dialog-close-btn:active { transform: scale(.94); }

/* Toast */
.toast-container {
  position: fixed;

  left: 50%;
  transform: translateX(-50%);

  pointer-events: none;

}
.toast-container.show { display: block; }
.toast-item {

  color: #fff;
  padding: .75rem 1rem;

<!-- Service Worker source para hospedagem offline -->
<script type="text/plain" id="adalex-sw-code">
const CACHE_NAME = "adalex-digital-v1.0";
const ASSETS = ["./", "./index.html", "./logo.png"];

self.addEventListener("install", (event) => {
  event.waitUntil(
    caches.open(CACHE_NAME).then((cache) => cache.addAll(ASSETS)).catch(() => {})
  );
  self.skipWaiting();
});

self.addEventListener("activate", (event) => {
  event.waitUntil(
    caches.keys().then((keys) =>
      Promise.all(keys.filter((k) => k !== CACHE_NAME).map((k) => caches.delete(k)))
    )
  );
  self.clients.claim();
});

self.addEventListener("fetch", (event) => {
  if (event.request.method !== "GET") return;
  const req = event.request;
  const isNav = req.mode === "navigate" || (req.headers.get("accept") || "").includes("text/html") || req.url.endsWith("index.html");
  if (isNav) {
    event.respondWith(
      fetch(req, { cache: "no-store" })
        .then((response) => {
          if (response && response.status === 200) {
            const copy = response.clone();
            caches.open(CACHE_NAME).then((cache) => cache.put(req, copy));
          }
          return response;
        })
        .catch(() => caches.match(req).then((c) => c || caches.match("./index.html")))
    );
    return;
  }
  event.respondWith(
    caches.match(req).then((cached) => {
      const networkFetch = fetch(req)
        .then((response) => {
          if (response && response.status === 200) {
            const copy = response.clone();
            caches.open(CACHE_NAME).then((cache) => cache.put(req, copy));
          }
          return response;
        })
        .catch(() => cached);
      return cached || networkFetch;
    })
  );
});
